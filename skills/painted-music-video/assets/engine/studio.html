<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Music video studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Shantell+Sans:wght@800&display=block">
<style>
  html, body { margin: 0; background: #1b1820; color: #eee; font: 13px system-ui, sans-serif; }
  main { padding: 12px; display: grid; gap: 8px; }
  #out { width: min(100%, 1280px); aspect-ratio: 16 / 9; height: auto; background: #F3EBDC; }
  .p5Canvas { display: none !important; }
  .bar { display: flex; gap: 10px; align-items: center; max-width: 1280px; }
  #scrub { flex: 1; }
  #tt { font-variant-numeric: tabular-nums; min-width: 190px; }
</style>
<script src="node_modules/p5/lib/p5.min.js"></script>
<script src="node_modules/p5.brush/dist/p5.brush.js"></script>
</head>
<body>
<main>
  <canvas id="out" width="1920" height="1080"></canvas>
  <div class="bar"><input id="scrub" type="range" min="0" max="180" step="0.0417" value="0"><span id="tt">loading…</span></div>
</main>
<!-- engine. beats.js and lyrics.js are generated by the skill's scripts (analyze_song.py, align_lyrics.py). -->
<script src="src/config.js"></script>
<script src="src/beats.js"></script>
<script src="src/core.js"></script>
<script src="src/clawd.js"></script>
<script src="src/timeline.js"></script>
<script src="src/lyrics.js"></script>
<!-- a re-cut edition (references/recut.md) adds: src/beats-recut.js, src/lyrics-recut.js, src/recut.js -->
<!-- cast, props, sets and sheets -->
<script src="src/cast.js"></script>
<script src="src/props.js"></script>
<script src="src/sheets.js"></script>
<!-- the video, one file per chapter (song section), in order -->
<script src="src/ch/c00_example.js"></script>
<script>
  // studio.html?loop=cast (or emotions, views, arms, ref_<look>) scrubs a standalone loop instead of the video;
  // ?t=12.5 jumps to a time; ?edition=<name> plays a re-cut.
  const q = new URLSearchParams(location.search).get('loop'); if (q && LOOPS[q]) window.LOOP = LOOPS[q];
</script>
</body>
</html>
